name: CodeQL

# Scans the C# code by actually building the UWP app with MSBuild on Windows.
# GitHub's default setup can only use build-mode "none" (no build), which can't
# resolve UWP, WinUI or Game Bar types and so produced a low-quality scan.
# This replaces default setup: turn that off under Settings > Code security.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - uses: microsoft/setup-msbuild@v2

      # Debug build only: compiles the code without the slow .NET Native step
      # or packaging and signing, which the scan doesn't need.
      - name: Build
        shell: pwsh
        run: |
          msbuild CopilotGameBarBridge.sln /restore /m `
            /p:Configuration=Debug /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false `
            /p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed" }

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
